# Full local stack: MongoDB (single-node replica set for transactions), Kafka (KRaft) and
# the application itself.
#
# Start:  docker compose up -d --build
# Stop:   docker compose down
services:
  mongodb:
    image: mongo:7.0
    container_name: orchestrator-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >-
        mongosh --quiet --eval
        "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafka:
    image: apache/kafka:4.4.0
    container_name: orchestrator-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  app:
    build: .
    container_name: orchestrator-app
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/orchestrator?replicaSet=rs0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_JOB_REQUEST_TOPIC: job-requests
      KAFKA_JOB_EVENTS_TOPIC: job-events
      KAFKA_DEAD_LETTER_TOPIC: job-requests-dlt
      KAFKA_CONSUMER_GROUP: data-job-orchestrator
      DATAPROC_PROVIDER: noop
      OTEL_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mongodb_data:
  kafka_data:
